name: Weekly recap email

# Sends every user active in the last 7 days their spending recap. The heavy
# lifting is in the API (POST /internal/weekly-recap); this job just triggers it
# on a schedule, since Render's free tier has no built-in cron.
#
# Setup (one-time):
#   1. Pick a random secret and set it as CRON_SECRET on the Render `spendjot-api`
#      service (Environment tab).
#   2. Add the SAME value as a GitHub repo secret named CRON_SECRET
#      (Settings -> Secrets and variables -> Actions).

on:
  schedule:
    - cron: "0 15 * * 0" # Sundays 15:00 UTC (~8pm Pakistan time)
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger weekly recap
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET repo secret is not set — skipping."
            exit 0
          fi
          code=$(curl -sS -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://spendjot-api.onrender.com/api/v1/internal/weekly-recap" \
            -H "X-Cron-Secret: $CRON_SECRET" --max-time 300)
          echo "HTTP $code"; cat /tmp/out.json || true; echo
          test "$code" = "200"
